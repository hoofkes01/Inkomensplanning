  function leesBrandNewDayWords(data) {
    const woorden = Array.isArray(data && data.words) ? data.words : [];

      let x = String(t).replace(/[^0-9,.-]/g, "");
      if (!x) return null;
      if (x.includes(",")) x = x.replace(/\./g, "").replace(",", ".");
      const n = Number(x);
      return Number.isFinite(n) ? n : null;
    };
    const euroWords = rows.filter(w => /€/.test(w.text) || /^(?:\d{1,3}(?:\.\d{3})*,\d{2})$/.test(w.text));
    // Een BND-regel heeft drie kolommen. We nemen de eurobedragen links/midden
    // (koers) en rechts (fondswaarde) die op ongeveer dezelfde y-positie staan.
    const anchors = [];
    for (const w of euroWords) {
      const v = euro(w.text);
      if (!(v > 0)) continue;
      const centerY = (w.top + w.bottom) / 2;
      if (w.left >= 200 && w.left < 390 && v < 100) {
        const valueWord = euroWords.find(x => {
          const vx = euro(x.text);
          const cy = (x.top + x.bottom) / 2;
          return vx != null && vx >= 100 && x.left >= 480 && Math.abs(cy - centerY) < 45;
        });
        if (valueWord) anchors.push({ y: centerY, koers: v, waarde: euro(valueWord.text) });
      }
    }
    anchors.sort((a,b) => a.y - b.y);
    const uniek=[];
    for (const a of anchors) {
      if (!uniek.some(x => Math.abs(x.y-a.y) < 20)) uniek.push(a);
    }
    if (!uniek.length) return null;

    const bndStarts = rows.filter(w => /^BND$/i.test(w.text) && w.left < 180)
      .map(w => ({ y:(w.top+w.bottom)/2 })).sort((a,b)=>a.y-b.y);

      for (let j=0;j<bndStarts.length;j++) {

      if (start < 0) continue;
      const startY=bndStarts[start].y-25;

      const naam=naamWoorden.sort((x,y)=>x.top-y.top || x.left-y.left).map(w=>w.text).join(" ")
        .replace(/([A-Za-zÀ-ÿ])-\s+(?=[a-zà-ÿ])/g, "$1")

      let eersteKoersRegel = -1;
      for (let i = 0; i < blok.length; i++) {

          continue;

        if (/^BND\b/i.test(r)) {
          if (huidig) bndNamen.push(huidig.join(" "));

          continue;

        if (huidig && eersteKoersRegel < 0 &&

            !/^(?:\d+(?:[.,]\d+)?%|Openstaand|Uitgevoerd|Aankomende|Upcoming)/i.test(r)) {
          huidig.push(r);
        }

      if (huidig) bndNamen.push(huidig.join(" "));

      const euroAlle = [];
      for (let i = 0; i < blok.length; i++) {
        for (const vm of valutaMatches(blok[i])) euroAlle.push(vm.value);
      }

      // reeks fondswaarden. Neem precies zoveel koersen als er fonds-namen
      // zijn. Daarna nemen we de eerste even grote reeks fondswaarden.
      const kleine = euroAlle.filter(v => v > 0 && v < 100);
      const grote = euroAlle.filter(v => v >= 100);
      const n = Math.min(bndNamen.length, kleine.length, grote.length);
      if (n > 0) {
        const koersen = kleine.slice(0, n);
        const waarden = grote.slice(0, n);
        const bndPosities = [];
        for (let i = 0; i < n; i++) {
          const koers = koersen[i];
          const waarde = waarden[i];
          if (!(koers > 0) || !(waarde >= 0)) continue;
          const naam = bndNamen[i]
            .replace(/\s+/g, " ")
            .replace(/\s+-\s+/g, "-")
            .trim();
          if (!naam) continue;
          bndPosities.push({
            naam,
            koers,
            waarde,
            aantal: waarde / koers
          });
        }
        if (bndPosities.length) {
          const bndTotaal = bndPosities.reduce((som, r) => som + (Number(r.waarde) || 0), 0);
          return { totaal: bndTotaal, posities: bndPosities };
        }

  // Rente op een deposito: jaarlijks bijgeschreven op de exacte jaardag van de stortingsdatum,

  function berekenDepositoMetRente(item, rendementPct) {
    const start = geldigeDatum(stortingsdatums[item.id]);
    if (!start || !rendementPct) {

    bronnen = [...bronnen, ...extraBronnenVoor("man", atDate)];
    const r = verdeelKorting(bronnen, naAOW, atDate);
    const totaal = r.bronnen.reduce((s2, b) => s2 + b.netto, 0);
    const delen = r.bronnen.map(b => `${b.naam} ${euro(Math.round(b.netto))}${b.krijgtKorting ? " (met korting)" : ""}`).join(" + ");
    return {
      value: totaal,
      label: `${delen}${r.toegepastBij ? ` — heffingskorting bij ${r.toegepastBij}` : ""}`,
      status: regime === "salaris" ? "vast" : "voorlopig"
    };
  }
  // Voor Twanny na stoppen vóór haar AOW is uitsluitend het geïndexeerde bruto
  // Rabopensioen het inkomen. Het opgeslagen netto-bedrag is alleen een referentie
  // voor de huidige situatie en mag de prognose niet sturen.
  // Heffingskorting wordt hier rechtstreeks toegepast op het Rabo-pensioen, precies
  // één keer. Daardoor mag verdeelKorting() dit bedrag daarna niet nogmaals verhogen.
  function raboPreAowNettoVanafBruto(atDate) {
    const brutoMaand = indexedValue(basis.raboVoorAOWBruto, indexRaboPreAOW, atDate);
    const brutoJaar = Math.max(0, brutoMaand * 12);
    if (brutoJaar <= 0) return 0;

    const belasting = belastingVoorAOW(brutoJaar);
    const zvw = zvwBijdrage(brutoJaar, atDate);
    // Geen heffingskorting hier: verdeelKorting() wijst die automatisch aan
    // de hoogste inkomensbron toe en past hem precies één keer toe.
    const nettoJaar = brutoJaar - belasting - zvw;
    return Math.max(0, nettoJaar) / 12;
  }

  function vrouwInkomen(regime, atDate) {
    const idx = (b, ix) => indexedValue(b, ix, atDate);
    let bronnen = [];
    let naAOW = false;
    let extraLabel = "";
    switch (regime) {
      case "werk":
        bronnen = [{
          naam: "Lincare",
          netto: idx(basis.lincareNetto, indexLincare),
          brutoJaar: 2050 * 12,
          heeftKorting: !!basis.kortingInLincare
        }, {
          naam: "Rabopensioen",
          netto: idx(basis.raboVoorAOWNetto, indexRaboPreAOW),
          brutoJaar: basis.raboVoorAOWBruto * 12,
          heeftKorting: !!basis.kortingInRaboVoorAOW
        }];
        break;
      case "gestopt_voor_aow":
        {
          // Stoppen met werken betekent niet dat PFZW direct ingaat.
          // PFZW start uitsluitend op de in de huidige planner vastgelegde
          // pensioendatum D_2034_01.
          bronnen = [{
            naam: "Rabopensioen",
            // Na stoppen is dit de enige inkomensbron van Twanny vóór AOW:
            // bruto Rabo, geïndexeerd. Het netto is al volledig fiscaal berekend,
            // inclusief de gekozen heffingskorting. Daarom geen tweede korting via verdeelKorting.
            netto: raboPreAowNettoVanafBruto(atDate),
            brutoJaar: indexedValue(basis.raboVoorAOWBruto, indexRaboPreAOW, atDate) * 12,
            heeftKorting: false
          }];
          // PFZW start vanaf de AOW-datum van Twanny, niet op een vaste 1-1-datum.
          if (atDate >= vrouwAOWDate) {
            bronnen.push({
              naam: "PFZW",
              netto: idx(basis.pfzwNettoMaand, indexPFZW),
              brutoJaar: basis.pfzwBrutoJaar,
              heeftKorting: !!basis.kortingInPfzw
            });
          }
          bronnen = [...bronnen, ...extraBronnenVoor("vrouw", atDate)];
          // Ook na stoppen loopt de berekening via dezelfde centrale kortingstoewijzing.
          // Daarmee ontstaat op de stopdatum de juiste sprong: het arbeidsinkomen valt weg
          // en de heffingskorting gaat automatisch naar de hoogste overblijvende bron.
          const r0 = verdeelKorting(bronnen, false, atDate);
          const tot0 = r0.bronnen.reduce((s2, b) => s2 + b.netto, 0);
          const del0 = r0.bronnen.map(b => `${b.naam} ${euro(Math.round(b.netto))}${b.krijgtKorting ? " (met korting)" : ""}`).join(" + ");
          return {
            value: tot0,
            label: `Gestopt met werken — ${del0}${r0.toegepastBij ? ` — heffingskorting bij ${r0.toegepastBij}` : ""}`,
            status: "voorlopig"
          };
        }
      case "post_aow":
        naAOW = true;
        bronnen = [{
          naam: "AOW",
          netto: idx(aowNettoVrouw, indexAOW),
          brutoJaar: AOW_BRUTO_PP_MAAND * 12,
          heeftKorting: !!Number(basis.kortingInAOWVrouw)
        }, {
          naam: "Rabopensioen",
          netto: idx(RABO_POST_AOW_NETTO, indexRaboPostAOW),
          brutoJaar: RABO_POST_AOW_BRUTO * 12,
          heeftKorting: !!basis.kortingInRaboNaAOW
        }];
        // PFZW hoort vanaf Twanny's AOW-datum bij haar pensioeninkomen.
        bronnen.push({
          naam: "PFZW",
          netto: idx(basis.pfzwNettoMaand, indexPFZW),
          brutoJaar: basis.pfzwBrutoJaar,
          heeftKorting: !!basis.kortingInPfzw
        });
        break;
      default:
        return {
          value: null,
          label: "-",
          status: "ontbrekend"
        };
    }
    bronnen = [...bronnen, ...extraBronnenVoor("vrouw", atDate)];
    const r = verdeelKorting(bronnen, naAOW, atDate);
    const totaal = r.bronnen.reduce((s2, b) => s2 + b.netto, 0);
    const delen = r.bronnen.map(b => `${b.naam} ${euro(Math.round(b.netto))}${b.krijgtKorting ? " (met korting)" : ""}`).join(" + ");
    return {
      value: totaal,
      label: `${delen}${r.toegepastBij ? ` — heffingskorting bij ${r.toegepastBij}` : ""}`,
      status: regime === "werk" ? "vast" : "voorlopig"
    };
  }
  function verdeelKorting(bronnen, naAOW, atDate) {
    // Twee soorten bronnen. (1) Een echt loonstrook-/pensioenopgavebedrag (salaris, ABP,
    // Lincare) bevat al de eigen heffingskorting via de loonheffing van die betaler — daar
    // wordt nooit iets aan toegevoegd of afgehaald. (2) Een bedrag dat zonder korting is
    // ingevuld (Rabopensioen, PFZW, AOW-tabelbedrag) krijgt de gezamenlijke heffingskorting
    // toegewezen zodra het de hoogste bruto bron van dit type is — precies zoals in
    // werkelijkheid maar één betaler tegelijk de loonheffingskorting toepast.
    const actief = bronnen.filter(b => b.netto > 0);
    if (actief.length === 0) return { bronnen: [], toegepastBij: null, kortingMaand: 0 };

    const totaalBruto = actief.reduce((s2, b) => s2 + (b.brutoJaar || 0), 0);
    const belastingTotaal = naAOW ? belastingBoxEen(totaalBruto, atDate) : belastingVoorAOW(totaalBruto);
    const kortingBeschikbaar = algemeneHeffingskorting(totaalBruto, naAOW, atDate) + ouderenkorting(totaalBruto, naAOW, atDate);
    const kortingJaar = Math.min(belastingTotaal, kortingBeschikbaar);
    const kortingMaand = kortingJaar / 12;

    // Alleen als er voor deze persoon in deze fase géén loonstrookbron actief is (die de
    // korting al zelf toepast), mag de hoogste overige bron de gezamenlijke korting krijgen.
    // Is er wél zo'n bron (bijvoorbeeld Lincare), dan blijven de overige bronnen op hun
    // ingevulde bedrag staan — in werkelijkheid past ook maar één betaler tegelijk de
    // loonheffingskorting toe.
    const heeftLoonstrookbron = actief.some(b => b.heeftKorting);
    const kandidaten = heeftLoonstrookbron ? [] : actief.filter(b => !b.heeftKorting);
    const hoogste = kandidaten.length
      ? kandidaten.reduce((a, b) => (b.brutoJaar || b.netto) > (a.brutoJaar || a.netto) ? b : a, kandidaten[0])
      : null;
    const aangepast = actief.map(b => {
      const isHoogste = !!hoogste && b.naam === hoogste.naam;
      const netto = isHoogste ? b.netto + kortingMaand : b.netto;
      return { ...b, netto: Math.max(0, netto), krijgtKorting: isHoogste };
    });
    return { bronnen: aangepast, toegepastBij: hoogste ? hoogste.naam : null, kortingMaand: hoogste ? kortingMaand : 0 };
  }

  // Vertaalt de werkkeuze van een jaar naar het bijbehorende inkomensregime.
  function manRegimeVoorJaar(jaar) {
    const keuze = werkkeuzeMan[jaar] || (jaar <= PEILDATUM.getFullYear() ? "fulltime" : "gestopt");
    if (keuze === "fulltime") return "salaris";
    if (keuze === "parttime") return "parttime_abp";
    return "abp_pre";
  }
  // Vanaf welk jaar Twanny stopt met werken; niet ingevuld = het jaar van haar AOW.
  // PFZW bij vervroegde ingang: het door PFZW opgegeven bedrag heeft voorrang. Is dat niet
  // ingevuld, dan rekent de app met een korting per jaar dat de uitkering eerder ingaat.
  function pfzwNettoBijIngang(ingangsdatum) {
    const basisBedrag = Number(basis.pfzwNettoMaand) || 0;
    if (!vrouwAOWDate || ingangsdatum >= vrouwAOWDate) return basisBedrag;
    const opgegeven = Number(basis.pfzwVervroegdNetto) || 0;
    if (opgegeven > 0) return {
      bedrag: opgegeven,
      bron: "opgegeven"
    };
    const korting = (Number(basis.pfzwKortingPerJaar) || 0) / 100;
    const jarenEerder = Math.max(0, (vrouwAOWDate - ingangsdatum) / MS_PER_JAAR);
    if (korting > 0) return {
      bedrag: basisBedrag * Math.max(0, 1 - korting * jarenEerder),
      bron: "geschat"
    };
    // Niets bekend: het bedrag wordt bij vervroegd ingaan lager, maar hoeveel weten we niet.
    // We tonen het ongekorte bedrag als bovengrens en markeren dat duidelijk.
    return {
      bedrag: basisBedrag,
      bron: "onbekend"
    };
  }
  const vrouwStopDatumEffectief = useMemo(() => {
    if (vrouwStopDatum) {
      const d = new Date(`${vrouwStopDatum}T00:00:00`);
      if (!isNaN(d.getTime())) return d;
    }
    if (vrouwStopJaar != null && vrouwStopJaar !== "") return new Date(Number(vrouwStopJaar), 0, 1);
    return vrouwAOWDate || new Date(PEILDATUM.getFullYear(), 0, 1);
  }, [vrouwStopDatum, vrouwStopJaar, vrouwAOWDate]);
  const vrouwStopJaarEffectief = vrouwStopDatumEffectief.getFullYear();
  const phases = (() => {
    // Elke 1 januari kan de werkkeuze wijzigen, dus dat zijn allemaal mogelijke breekpunten.
    const events = [];
    for (let jaar = PEILDATUM.getFullYear() + 1; jaar <= manAOWDate.getFullYear() + 1; jaar++) {
      events.push({
        date: new Date(jaar, 0, 1),
        kind: "jaarwissel"
      });
    }
    events.push({
      date: vrouwStopDatumEffectief,
      kind: "vrouwStopt"
    });
    events.push({
      date: vrouwAOWDate,
      kind: "vrouwAOW"
    });
    events.push({
      date: manAOWDate,
      kind: "manAOW"
    });
    events.push({
      date: lijfrenteStartMan,
      kind: "lijfrenteStartMan"
    });
    events.push({
      date: lijfrenteStartVrouw,
      kind: "lijfrenteStartVrouw"
    });
    events.push({
      date: vakantiegeldStartMan,
      kind: "vakantiegeldStartMan"
    });
    events.push({
      date: vakantiegeldStartVrouw,
      kind: "vakantiegeldStartVrouw"
    });
    events.sort((a, b) => a.date - b.date);
    let cursor = PEILDATUM;
    const list = [];
    const punten = [...events.filter(e => e.date > PEILDATUM).map(e => e.date), null];
    // Dubbele datums samenvoegen zodat er geen lege fasen ontstaan.
    const uniek = [];
    punten.forEach(d => {
      if (d === null) {
        uniek.push(null);
        return;
      }
      if (!uniek.some(x => x && x.getTime() === d.getTime())) uniek.push(d);
    });

    // Fasen korter dan een maand samenvoegen met de volgende: zo'n snipper zegt niets en maakt
    // het overzicht alleen onleesbaar.
    const MIN_DAGEN = 28;
    const samengevoegd = [];
    uniek.forEach((d, n) => {
      const vorige = samengevoegd.length ? samengevoegd[samengevoegd.length - 1] : cursor;
      if (d === null) {
        samengevoegd.push(null);
        return;
      }
      const vorigeDatum = vorige === null ? cursor : vorige;
      const dagen = (d - (vorigeDatum instanceof Date ? vorigeDatum : cursor)) / (1000 * 60 * 60 * 24);
      if (dagen < MIN_DAGEN && samengevoegd.length > 0) {
        // Te korte fase: laat de vorige grens staan als daar een echte overgang zit (zoals de
        // AOW-datum) en schuif in plaats daarvan deze grens weg.
        const vorigeIsAOW = vorigeDatum instanceof Date && (vorigeDatum.getTime() === manAOWDate.getTime() || vorigeDatum.getTime() === vrouwAOWDate.getTime());
        if (!vorigeIsAOW) samengevoegd[samengevoegd.length - 1] = d;
      } else {
        samengevoegd.push(d);
      }
    });
    samengevoegd.forEach(eind => {
      const r = regimesOpDatum(cursor);
      list.push({
        start: cursor,
        end: eind,
        manRegime: r.manRegime,
        vrouwRegime: r.vrouwRegime,
        degiroActief: r.degiroActief,
        bndActief: r.bndActief,
        vakantiegeldManActief: r.vakantiegeldManActief,
        vakantiegeldVrouwActief: r.vakantiegeldVrouwActief
      });
      if (eind) cursor = eind;
    });
    return list.map(p => {
      const man = manInkomen(p.manRegime, p.start);
      const vrouw = vrouwInkomen(p.vrouwRegime, p.start);
      let manVal = man.value == null ? null : Math.round(man.value);
      let manLabel = man.label;
      if (p.degiroActief && p.manRegime === "abp_post" && manVal != null) {
        manVal = manVal + Math.round(degiroNettoMaand);
        manLabel = `${man.label} + DEGIRO-lijfrente netto (${euro(Math.round(degiroNettoMaand))}, marginaal belast)`;
      }
      let vrouwVal = vrouw.value == null ? null : Math.round(vrouw.value);
      let vrouwLabel = vrouw.label;
      if (p.bndActief && p.vrouwRegime === "post_aow" && vrouwVal != null) {
        vrouwVal = vrouwVal + Math.round(bndNettoMaand);
        vrouwLabel = `${vrouw.label} + BND-lijfrente netto (${euro(Math.round(bndNettoMaand))}, marginaal belast)`;
      }
      // Een fase begint op de 1e; de opname valt op de 22e van diezelfde maand. Kijk daarom naar
      // de 22e, anders wordt een uitgezet jaar toch als opname getoond.
      const fasePeil = new Date(p.start.getFullYear(), p.start.getMonth(), 22);
      const aanvulling = obLooptOp(fasePeil) ? Number(obBedrag) || 0 : 0;
      if (aanvulling > 0 && manVal != null) {
        // De aanvulling hoort bij het inkomen van Michiel, dus ook bij zijn bedrag optellen.
        manVal = manVal + aanvulling;
        manLabel = `${manLabel} + aanvulling uit DEGIRO03 (${euro(aanvulling)})`;
      }
      const totaal = manVal == null || vrouwVal == null ? null : manVal + vrouwVal;
      const status = worstStatus(man.status, vrouw.status);
      return {
        ...p,
        man: {
          ...man,
          value: manVal,
          label: manLabel
        },
        vrouw: {
          ...vrouw,
          value: vrouwVal,
          label: vrouwLabel
        },
        totaal,
        status
      };
    });
  })();
  const maxTotaal = Math.max(...phases.map(p => p.totaal || 0), 1);

  // Herbruikbare regime-bepaling en inkomensberekening voor een willekeurige datum (niet alleen fase-starts),
  // nodig voor de maandelijkse lasten/baten-simulatie hieronder.
  function regimesOpDatum(datum) {
    let manRegime = manRegimeVoorJaar(datum.getFullYear());
    if (datum >= manAOWDate) manRegime = "abp_post";
    // Twanny: werkt tot haar exacte stopdatum, daarna alleen Rabopensioen tot haar AOW.
    let vrouwRegime = "werk";
    if (vrouwStopDatumEffectief && datum >= vrouwStopDatumEffectief && datum < vrouwAOWDate) {
      vrouwRegime = "gestopt_voor_aow";
    }
    if (datum >= vrouwAOWDate) vrouwRegime = "post_aow";
    return {
      manRegime,
      vrouwRegime,
      degiroActief: datum >= lijfrenteStartMan,
      bndActief: datum >= lijfrenteStartVrouw,
      vakantiegeldManActief: datum >= vakantiegeldStartMan,
      vakantiegeldVrouwActief: datum >= vakantiegeldStartVrouw
    };
  }
  function nettoHuishoudinkomenOpDatum(datum) {
    const r = regimesOpDatum(datum);
    const man = manInkomen(r.manRegime, datum);
    const vrouw = vrouwInkomen(r.vrouwRegime, datum);
    let manVal = man.value == null ? null : Math.round(man.value);
    if (r.degiroActief && r.manRegime === "abp_post" && manVal != null) manVal += Math.round(degiroNettoMaand);
    let vrouwVal = vrouw.value == null ? null : Math.round(vrouw.value);
    if (r.bndActief && r.vrouwRegime === "post_aow" && vrouwVal != null) vrouwVal += Math.round(bndNettoMaand);
    if (manVal == null || vrouwVal == null) return null;
    // Zelfde peilmoment als het fasenoverzicht: de aanvulling valt op de 22e van de maand, dus
    // check daar (niet op de 1e), anders lopen de twee blokken uit elkaar zodra de startdatum
    // van de aanvulling niet op de 1e van een maand valt.
    const aanvullingPeil = new Date(datum.getFullYear(), datum.getMonth(), 22);
    const aanvulling = obLooptOp(aanvullingPeil) ? Number(obBedrag) || 0 : 0;
    return manVal + vrouwVal + aanvulling;
  }

  // Vaste lasten per maand als losse posten (incl. hypotheek); vanaf 1-1-2031 vervalt
  // de aflossing en komt de rente-only hypotheeklast (instelbaar, zie hierboven) ervoor in de plaats.
  // Dagelijkse uitgaven (boodschappen e.d.) zijn een apart, eigen te indexeren bedrag.
  // Vaste lasten als losse posten, elk met eigen bedrag en indexatie. De hypotheekpost is
  // gemarkeerd zodat hij per 1-1-2031 automatisch wordt vervangen door de rente-only last.
  const [nieuweLastNaam, setNieuweLastNaam] = useOpslag("nieuweLastNaam", "");
  const [nieuweLastBedrag, setNieuweLastBedrag] = useOpslag("nieuweLastBedrag", "");
  const [nieuweLastIndex, setNieuweLastIndex] = useOpslag("nieuweLastIndex", "");
  function wijzigVasteLast(id, sleutel, waarde) {
    setVasteLastenPosten(prev => prev.map(p => p.id === id ? {
      ...p,
      [sleutel]: sleutel === "naam" ? waarde : Number(waarde) || 0
    } : p));
  }
  function verwijderVasteLast(id) {
    setVasteLastenPosten(prev => prev.filter(p => p.id !== id));
  }
  function voegVasteLastToe() {
    if (!nieuweLastNaam.trim() || !nieuweLastBedrag) return;
    setVasteLastenPosten(prev => [...prev, {
      id: `vl_${Date.now()}`,
      naam: nieuweLastNaam.trim(),
      bedrag: Number(nieuweLastBedrag) || 0,
      index: Number(nieuweLastIndex) || 0
    }]);
    setNieuweLastNaam("");
    setNieuweLastBedrag("");
    setNieuweLastIndex("");
  }

  // Reserveringspotjes: de vaste lasten die "Reservering" heten worden niet uitgegeven maar
  // opzijgezet. Ze verlaten dus wel de rekening-courant, maar komen in een eigen potje terecht.
  // Betalingen zoals de rente aan de kinderen gaan ten laste van dat potje, niet van het spaargeld.
  const [potSaldi, setPotSaldi] = useOpslag("potSaldi", {
    vl_res_rente: 1750,
    vl_res_zorg: 270,
    vl_res_auto: 210
  });
  const [potOnttrekkingen, setPotOnttrekkingen] = useOpslag("potOnttrekkingen", [{
    id: "po1",
    potId: "vl_res_rente",
    label: "Rente Elise",
    bedrag: 1000,
    datum: "2026-12-31"
  }, {
    id: "po2",
    potId: "vl_res_rente",
    label: "Rente Kevin",
    bedrag: 1000,
    datum: "2026-12-31"
  }, {
    id: "po3",
    potId: "vl_res_rente",
    label: "Schenking Youri",
    bedrag: 1000,
    datum: "2026-12-31"
  }]);
  const [nieuwePotId, setNieuwePotId] = useOpslag("nieuwePotId", "vl_res_rente");
  const [nieuwePotLabel, setNieuwePotLabel] = useOpslag("nieuwePotLabel", "");
  const [nieuwePotBedrag, setNieuwePotBedrag] = useOpslag("nieuwePotBedrag", "");
  const [nieuwePotDatum, setNieuwePotDatum] = useOpslag("nieuwePotDatum", "");
  const reserveringsPosten = vasteLastenPosten.filter(p => /^Reservering/i.test(p.naam || ""));
  function voegPotOnttrekkingToe() {
    if (!nieuwePotLabel.trim() || !nieuwePotBedrag || !nieuwePotDatum) return;
    setPotOnttrekkingen(prev => [...prev, {
      id: `po_${Date.now()}`,
      potId: nieuwePotId,
      label: nieuwePotLabel.trim(),
      bedrag: Number(nieuwePotBedrag) || 0,
      datum: nieuwePotDatum
    }]);
    setNieuwePotLabel("");
    setNieuwePotBedrag("");
    setNieuwePotDatum("");
  }

  // Reserveringspotten worden gevoed vanuit de corresponderende posten
  // in "Vaste lasten en dagelijkse uitgaven". De boeking vindt iedere maand
  // automatisch op de 23e plaats. Het is een interne verschuiving binnen het
  // vrij besteedbare vermogen: de rekening-courant daalt, de reserveringspot
  // stijgt met exact hetzelfde bedrag.
  function reserveringVoedingOpDatum(post, datum) {
    const start = new Date(PEILDATUM.getFullYear(), PEILDATUM.getMonth(), 23);
    const doel = new Date(datum.getFullYear(), datum.getMonth(), datum.getDate());
    if (doel < start) return 0;

    let maanden = 0;
    let cursor = new Date(start);
    while (cursor <= doel) {
      maanden++;
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 23);
    }
    return (Number(post.bedrag) || 0) * maanden;
  }

  function potSaldoOpDatum(post, datum) {
    const startSaldo = Number(potSaldi[post.id]) || 0;
    const voeding = reserveringVoedingOpDatum(post, datum);

    const depositos = VERMOGENS_ITEMS.filter(i => i.deposito && (!i.vervaldatum || new Date(i.vervaldatum) > doelDatum)).reduce((s, i) => s + depositoWaardeOpDatum(i, rendementen[i.id] || 0, doelDatum), 0);
    // Overige eigen vermogensbestanddelen (geen deposito, geen sparen/degiro/leningen)
    const overigeItems = VERMOGENS_ITEMS.filter(i => !i.deposito && i.custom).reduce((s, i) => {
      const start = i.stortingDatum ? new Date(i.stortingDatum) : PEILDATUM;
      if (start > doelDatum) return s;
      const jaren = Math.max(0, (doelDatum - start) / MS_PER_JAAR);
      return s + i.bedrag * Math.pow(1 + (rendementen[i.id] || 0) / 100, jaren);
    }, 0);

    // Lijfrentepotten: groeien tot de startdatum, daarna daalt de pot doordat er wordt uitgekeerd.
    function potWaarde(kapitaalNu, rendementVoor, rendementTijdens, startDatum, looptijdJaren, persoon) {
      const peil = doelDatum < startDatum ? doelDatum : startDatum;
      const jarenTotStart = Math.max(0, (peil - PEILDATUM) / MS_PER_JAAR);
      // Stortingen die vóór dit moment zijn gedaan, groeien mee vanaf hun eigen datum.
      let waarde = kapitaalNu * Math.pow(1 + rendementVoor / 100, jarenTotStart) + gestortTotIngang(persoon, rendementVoor, peil);
      if (doelDatum > startDatum) {
        const maandenUitgekeerd = Math.min(looptijdJaren * 12, Math.max(0, (doelDatum - startDatum) / MS_PER_JAAR * 12));
        const i = Math.pow(1 + rendementTijdens / 100, 1 / 12) - 1;
        const uitkering = annuiteitMaandBedrag(waarde, rendementTijdens, looptijdJaren);
        // Restwaarde na n uitkeringen (annuïteitenrestant)
        if (Math.abs(i) < 1e-9) {
          waarde = Math.max(0, waarde - uitkering * maandenUitgekeerd);
        } else {
          waarde = Math.max(0, waarde * Math.pow(1 + i, maandenUitgekeerd) - uitkering * ((Math.pow(1 + i, maandenUitgekeerd) - 1) / i));
        }
      }
      return waarde;
    }
    const lijfrentePotMan = potWaarde(basis.degiroPensioen, Number(lijfrenteRendementMan) || 0, Number(lijfrenteRendementUitkeringMan) || 0, lijfrenteStartMan, effectieveLooptijdMan, "man");
    const lijfrentePotVrouw = potWaarde(basis.bndPensioen, Number(lijfrenteRendementVrouw) || 0, Number(lijfrenteRendementUitkeringVrouw) || 0, lijfrenteStartVrouw, effectieveLooptijdVrouw, "vrouw");

    // De woning telt één keer mee tegen de volledige waarde; de hypotheekschuld wordt hieronder
    // apart afgetrokken. De netto overwaarde is dus het verschil tussen die twee.
    const onroerendGoed = Number(basis.woningWaarde) || 0;
    // Hypotheekschuld daalt door de maandelijkse aflossing tot 1-1-2031; daarna blijft hij vast.
    let hypotheekRestant = Number(basis.hypotheek) || 0;
    const mRente = (Number(basis.hypotheekRenteNu) || 0) / 100 / 12;
    const mLast = Number((vasteLastenPosten.find(x => x.isHypotheek) || {}).bedrag) || 0;
    let hCursor = new Date(PEILDATUM.getFullYear(), PEILDATUM.getMonth(), 1);
    const hEinde = doelDatum < D_2031_03 ? doelDatum : D_2031_03;
    while (hCursor < hEinde && hypotheekRestant > 0) {
      const rente = hypotheekRestant * mRente;
      hypotheekRestant -= Math.min(hypotheekRestant, Math.max(0, mLast - rente));
      hCursor = new Date(hCursor.getFullYear(), hCursor.getMonth() + 1, 1);
    }
    const schulden = hypotheekRestant + basis.leningElise + basis.leningKevin;
    const geoormerkt = reserveringsPosten.filter(post => post.id !== "vl_res_rente").reduce((s2, post) => s2 + potSaldoOpDatum(post, doelDatum), 0);
    const overbrugging = obSaldoOpDatum(doelDatum);
    const totaal = sparen + degiroVrij + depositos + overigeItems + geoormerkt + overbrugging + lijfrentePotMan + lijfrentePotVrouw + onroerendGoed - schulden;
    return {
      sparen,
      degiroVrij,
      depositos,
      overigeItems,
      geoormerkt,
      overbrugging,
      lijfrentePotten: lijfrentePotMan + lijfrentePotVrouw,
      onroerendGoed,
      schulden,
      vrijBesteedbaar: sparen + degiroVrij + depositos + overigeItems + geoormerkt + overbrugging,
      totaal
    };
  }
  // Verzamelt alle grote inkomsten/uitgaven, rente en echte waardemutaties tussen twee
  // kalenderdata. Puur informatief: deze lijst voedt alleen het overzicht, nooit de rest
  // van de app (die blijft altijd rekenen vanaf de actuele stand van vandaag).
  // Budgetneutrale vermogensverplaatsingen (storting/vrijval deposito, storting/terugstorting
  // inkomenspot, storting/opname tussen eigen potten en beleggingen) komen hier NOOIT in mee —
  // alleen het werkelijke resultaat (rente, koersresultaat) en geld dat het huishouden verlaat
  // of binnenkomt telt mee.
  function verzamelGroteBoekingen(begin, eind) {
    const dagKey = d => {
      const x = geldigeDatum(d);
      if (!x) return null;
      return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
    };
    const beginKey = dagKey(begin);
    const eindKey = dagKey(eind);
    if (!beginKey || !eindKey || beginKey >= eindKey) return { groot: [], klein: [], kleineBaten: 0, kleineLasten: 0, nettoVerschil: 0, begin, eind };

    // Een gebeurtenis hoort alleen bij het tijdvak als de kalenderdatum STRICT
    // na de begindatum en OP/VOOR de einddatum ligt.
    const binnenTijdvak = datum => {
      const k = dagKey(datum);
      return !!k && k > beginKey && k <= eindKey;
    };

    const gebeurtenissen = [];
    const voeg = (datum, bedrag, label, soort) => {
      const n = Number(bedrag) || 0;
      if (!binnenTijdvak(datum) || Math.abs(n) < 0.01) return;
      gebeurtenissen.push({datum: new Date(geldigeDatum(datum)), bedrag:n, label, soort});
    };

    // 1. Maandsaldo alleen als de boekdatum werkelijk in het gekozen tijdvak valt.
    let maand = new Date(begin.getFullYear(), begin.getMonth(), 1);
    const laatsteMaand = new Date(eind.getFullYear(), eind.getMonth(), 1);
    while (maand <= laatsteMaand) {
      const boekDatum = new Date(maand.getFullYear(), maand.getMonth(), 22);
      if (binnenTijdvak(boekDatum)) {
        const inkomen = nettoHuishoudinkomenOpDatum(boekDatum);
        const lasten = vasteLastenOpDatum(boekDatum);
        voeg(boekDatum, inkomen == null ? 0 : inkomen - lasten,
          `Saldo inkomsten − uitgaven ${fmtDate(boekDatum)}`, 'maandsaldo');
      }
      maand = new Date(maand.getFullYear(), maand.getMonth()+1, 1);
    }

    // 2. Grote inkomsten/uitgaven. Eerst het tijdvak filteren, daarna pas de bron verwerken.
    // Interne verhuizingen tussen eigen vermogensbestanddelen worden uitgesloten: dit is
    // budgetneutraal, het vermogen zelf verandert er niet door.
    const interne = /(deposito|belegging|degiro|hoofkes0[234]|brand new day|\bbnd\b|storting.*beleg|beleg.*storting|naar.*beleg|van.*beleg|vrijval.*deposito|terugbetaling.*deposito|sluiten.*deposito|naar.*spaar|van.*spaar)/i;
    const rente = /rente/i;
    const concrete = MUTATIES_SPAARGELD
      .flatMap(m => mutatieBoekingen(m, eind))
      .filter(b => binnenTijdvak(b.datum));
    concrete.forEach(b => {
      const label = String(b.label || '');
      if (interne.test(label) || rente.test(label)) return;
      voeg(b.datum, b.bedrag, label || 'Grote inkomsten/uitgaven', 'grote_post');
    });

    // 3. Rente precies één keer.
    concrete.forEach(b => {
      if (rente.test(String(b.label || ''))) voeg(b.datum, b.bedrag, b.label, 'rente');
    });

    // 4. Externe baten.
    vakantiegeldRijen.forEach(b => {
      const d = new Date(b.jaar, b.maand, b.dag);
      voeg(d, b.delta, b.omschrijving, 'vakantiegeld');
    });
    lijfrenteBoekingen.forEach(b => {
      if (/Teruggave IB/i.test(String(b.omschrijving || ''))) {
        const d = new Date(b.jaar, b.maand, b.dag);
        voeg(d, b.delta, b.omschrijving, 'grote_post');
      }
    });

    // 5. Rente op deposito's: het vervallen van een deposito zelf (de hoofdsom die terug
    // naar Sparen Rabo gaat) is budgetneutraal en zit hierboven al in de uitsluiting.
    // Alleen de opgebouwde rente over de hele looptijd is echte vermogensgroei; die boeken
    // we als losse post op de vervaldatum, ongeacht of de vervaldatum in het verleden of de
    // toekomst van dit tijdvak ligt.
    VERMOGENS_ITEMS.filter(i => i.deposito && geldigeDatum(i.vervaldatum)).forEach(i => {
      const verval = geldigeDatum(i.vervaldatum);
      if (!binnenTijdvak(verval)) return;
      const rendementPct = rendementen[i.id] || 0;
      if (!rendementPct) return;
      const eindwaarde = i.renteAlVerwerkt ? Number(i.bedrag) || 0 : berekenDepositoMetRente(i, rendementPct).waarde;
      const renteBedrag = eindwaarde - (Number(i.bedrag) || 0);
      voeg(verval, renteBedrag, `Rente ${i.label || 'deposito'} (bij vervaldatum)`, 'rente');
    });

    // 6. Onttrekkingen uit een reserveringspot (bijv. schenkingen aan de kinderen): dit geld
    // verlaat het huishouden echt en is dus geen interne verschuiving.
    potOnttrekkingen.forEach(o => {
      const d = geldigeDatum(o.datum);
      if (!d || !binnenTijdvak(d)) return;
      voeg(d, -(Number(o.bedrag) || 0), o.label || 'Onttrekking reserveringspot', 'grote_post');
    });

    // 7. Waardemutatie vrij beleggen. Alleen het echte resultaat; interne stortingen
    // en opnames tussen eigen potten worden niet als mutatie getoond.
    const vBegin = totaalVermogenOpDatum(begin);
    const vEind = totaalVermogenOpDatum(eind);
    const beleggingsMutatie = (Number(vEind.degiroVrij)||0) - (Number(vBegin.degiroVrij)||0);
    if (Math.abs(beleggingsMutatie) > 0.01) voeg(eind, beleggingsMutatie, 'Waardemutatie vrij beleggen', 'belegging');

    // Definitieve beveiliging: niets buiten het gekozen kalenderdatumbereik mag de UI bereiken.
    const definitief = gebeurtenissen.filter(x => binnenTijdvak(x.datum));

    const groot = definitief.filter(x => Math.abs(x.bedrag) >= 750).sort((a,b)=>a.datum-b.datum);
    const klein = definitief.filter(x => Math.abs(x.bedrag) < 750);
    const kleineBaten = klein.filter(x => x.bedrag > 0).reduce((s,x)=>s+x.bedrag,0);
    const kleineLasten = klein.filter(x => x.bedrag < 0).reduce((s,x)=>s+x.bedrag,0);
    const nettoVerschil = definitief.reduce((s,x)=>s+(Number(x.bedrag)||0),0);

    return { groot, klein, kleineBaten, kleineLasten, nettoVerschil, begin, eind };
  }

  function renderMutatieRijen(resultaat) {
    const { groot, kleineBaten, kleineLasten, nettoVerschil } = resultaat;
    const rij = (x,i) => React.createElement('div',{key:i,className:'flex justify-between gap-3 text-sm'},
      React.createElement('span',{className:'text-slate-700'},`${fmtDate(x.datum)} — ${x.label}`),
      React.createElement('span',{className:`font-mono font-semibold shrink-0 ${x.bedrag>0?'text-emerald-700':'text-red-700'}`},x.bedrag>0?'+':'−',euro(Math.abs(Math.round(x.bedrag)))));
    const children=[];
    groot.forEach((x,i)=>children.push(rij(x,i)));
    if(Math.abs(kleineBaten)>0.5) children.push(React.createElement('div',{key:'kb',className:'flex justify-between gap-3 text-sm text-emerald-700'},React.createElement('span',{className:'text-slate-700'},'Saldo kleine baten'),React.createElement('span',{className:'font-mono font-semibold'},'+',euro(Math.round(kleineBaten)))));
    if(Math.abs(kleineLasten)>0.5) children.push(React.createElement('div',{key:'kl',className:'flex justify-between gap-3 text-sm text-red-700'},React.createElement('span',{className:'text-slate-700'},'Saldo kleine lasten'),React.createElement('span',{className:'font-mono font-semibold'},'−',euro(Math.abs(Math.round(kleineLasten))))));
    children.push(React.createElement('div',{key:'netto',className:`mt-3 pt-2 border-t border-slate-200 flex justify-between text-sm font-semibold ${nettoVerschil>0?'text-emerald-700':nettoVerschil<0?'text-red-700':'text-slate-600'}`},React.createElement('span',null,'Netto afwijking vrij vermogen'),React.createElement('span',{className:'font-mono'},nettoVerschil>0?'+':nettoVerschil<0?'−':'',euro(Math.abs(Math.round(nettoVerschil))))));
    return children;
  }

  function renderPeildatumVerklaring(peildatum, vandaag = APP_VANDAAG) {
    const dagKey = d => {
      const x = geldigeDatum(d);
      if (!x) return null;
      return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
    };
    const peilKey = dagKey(peildatum);
    const vandaagKey = dagKey(vandaag);
    if (!peilKey || !vandaagKey || peilKey === vandaagKey) return null;
    const historisch = peilKey < vandaagKey;
    const begin = historisch ? geldigeDatum(peildatum) : geldigeDatum(vandaag);
    const eind = historisch ? geldigeDatum(vandaag) : geldigeDatum(peildatum);

    const resultaat = verzamelGroteBoekingen(begin, eind);
    const children = renderMutatieRijen(resultaat);

    return React.createElement('section',null,
      React.createElement('h2',{className:'font-serif text-xl mb-4'},'Verklaring afwijking vermogen'),
      React.createElement('div',{className:'bg-white rounded-lg border border-slate-200 p-5'},
        React.createElement('p',{className:'text-xs text-slate-500 mb-3'},'Werkelijke inkomsten, uitgaven, rente en beleggingsresultaat tussen ',fmtDate(begin),' en ',fmtDate(eind),'. Interne verhuizingen tussen eigen vermogensbestanddelen zijn uitgesloten.'),
        React.createElement('div',{className:'space-y-1'},children)));
  }

  // Vroegste bekende datum in de gegevens: startpunt van het historie-en-toekomstoverzicht.
  // Dit overzicht is puur informatief en heeft geen invloed op de rest van de app, die altijd
  // rekent vanaf de actuele stand van vandaag.
  function vroegsteBekendeDatum() {
    const kandidaten = [PEILDATUM];
    Object.values(stortingsdatums).forEach(d => { const g = geldigeDatum(d); if (g) kandidaten.push(g); });
    MUTATIES_SPAARGELD.forEach(m => { const g = geldigeDatum(m.datum); if (g) kandidaten.push(g); });
    potOnttrekkingen.forEach(o => { const g = geldigeDatum(o.datum); if (g) kandidaten.push(g); });
    const gStart = geldigeDatum(obStart);
    if (gStart) kandidaten.push(gStart);
    return kandidaten.reduce((min, d) => d < min ? d : min, PEILDATUM);
  }

  function renderGroteBoekingenOverzicht() {
    const begin = vroegsteBekendeDatum();
    const eind = projectieEinde;
    const resultaat = verzamelGroteBoekingen(begin, eind);
    const children = renderMutatieRijen(resultaat);
    return React.createElement('section', null,
      React.createElement('h2', {className:'font-serif text-xl mb-4'}, 'Alle grote inkomsten en uitgaven — historie en toekomst'),
      React.createElement('div', {className:'bg-white rounded-lg border border-slate-200 p-5'},
        React.createElement('p', {className:'text-xs text-slate-500 mb-3'}, 'Elke bekende grote mutatie vanaf ', fmtDate(begin), ' tot ', fmtDate(eind), ': werkelijke inkomsten, uitgaven, rente, schenkingen en beleggingsresultaat. Vermogensverplaatsingen tussen eigen potten, deposito\'s en beleggingen zijn budgetneutraal en staan er dus niet in — alleen wat het vermogen echt laat groeien of krimpen. Dit overzicht is puur informatief en verandert niets aan de rest van de app, die altijd rekent vanaf de actuele stand van vandaag.'),
        React.createElement('div', {className:'space-y-1 max-h-[32rem] overflow-y-auto pr-1'}, children.length ? children : React.createElement('p',{className:'text-sm text-slate-400'},'Geen grote mutaties gevonden in deze periode.'))));
  }

  function renderAdvies() {
    const BUFFER = 15000, RISICO_PCT = 50;
    const vandaag = APP_VANDAAG;
    const overDrieMaanden = new Date(vandaag.getFullYear(), vandaag.getMonth() + 3, vandaag.getDate());
    const datums = [vandaag, overDrieMaanden];
    for (let j = vandaag.getFullYear() + 1; j <= vandaag.getFullYear() + 5; j++) datums.push(new Date(j, 0, 1));
    const adviesOpDatum = datum => {
      const v = totaalVermogenOpDatum(datum);
      // Het adviesvermogen bestaat uit al het vermogen waarover nu of later vrij kan worden beschikt.
      // De inkomenspot (overbrugging) hoort hier nadrukkelijk bij: die is vrij beschikbaar vermogen
      // en wordt in deze app tegen rendement aangehouden. Pensioenpotten en woning blijven buiten beeld.
      const nieuwTeVerdelen = Math.max(0, (Number(v.sparen)||0) + (Number(v.depositos)||0));
      const bestaandVrijBelegd = Math.max(0, Number(v.degiroVrij)||0);
      const inkomenspot = Math.max(0, Number(v.overbrugging)||0);
      const totaalVrij = Math.max(0, Number(v.vrijBesteedbaar)||0);
      const risicoMax = totaalVrij * RISICO_PCT / 100;
      // De bestaande vrije portefeuille én de inkomenspot worden al als risicodragend vermogen beschouwd.
      const bestaandRisico = bestaandVrijBelegd + inkomenspot;
      // De bestaande vrije beleggingen en de inkomenspot tellen volledig mee
      // in de verhouding beleggen/sparen. Nieuwe beleggingen komen daar dus bovenop.
      const beleggenVoorVerhouding = bestaandRisico;
      const sparenVoorVerhouding = Math.max(0, totaalVrij - beleggenVoorVerhouding);
      const beleggenPct = totaalVrij > 0 ? (beleggenVoorVerhouding / totaalVrij) * 100 : 0;
      const sparenPct = totaalVrij > 0 ? (sparenVoorVerhouding / totaalVrij) * 100 : 0;
      const tekortBuffer = Math.max(0, BUFFER - (Number(v.sparen)||0));
      const bovenBuffer = Math.max(0, (Number(v.sparen)||0) - BUFFER);
      const nieuwBeleggenMax = Math.max(0, risicoMax - bestaandRisico);
      // Zodra de buffer op €15.000 staat, wordt nieuw veilig vermogen niet als
      // onbelegd spaargeld aangehouden maar als een halfjaarlijkse deposito-dakpan.
      const veiligBovenBuffer = Math.max(0, sparenVoorVerhouding - BUFFER);
      const dakpanBedragPerHalfjaar = Math.round(veiligBovenBuffer / 2);
      return {...v, nieuwTeVerdelen, bestaandVrijBelegd, inkomenspot, totaalVrij, risicoMax, bestaandRisico, beleggenVoorVerhouding, sparenVoorVerhouding, beleggenPct, sparenPct, tekortBuffer, bovenBuffer, veiligBovenBuffer, dakpanBedragPerHalfjaar, nieuwBeleggenMax};
    };
    const nu = adviesOpDatum(vandaag);

    // Samenvatting van de eigen rentevisie. Puur beschrijvend: er wordt niets mee gerekend.
    const visieSamenvatting = (function () {
      const v = rentevisie || {};
      const richting = v.richting || "gelijk";
      const stap = String(v.verandering || "").replace(",", ".");
      const stapGetal = stap === "" ? null : Number(stap);
      const stapTekst = (stapGetal != null && !isNaN(stapGetal) && stapGetal !== 0)
        ? ` met ongeveer ${Math.abs(stapGetal).toFixed(2).replace(".", ",")} procentpunt`
        : "";
      const kop = richting === "daalt" ? `Verwachting: de rente daalt${stapTekst}`
        : richting === "stijgt" ? `Verwachting: de rente stijgt${stapTekst}`
        : "Verwachting: de rente blijft ongeveer gelijk";
      const bron = (v.bron || "").trim();
      const datum = v.datum ? new Date(v.datum) : null;
      const datumGeldig = datum && !isNaN(datum);
      const dagen = datumGeldig ? Math.max(0, Math.floor((new Date() - datum) / 86400000)) : null;
      const verouderd = !datumGeldig || dagen > 120;
      const herkomst = bron
        ? (datumGeldig ? `Bron: ${bron}, visie van ${fmtDate(datum)} (${dagen} dagen geleden).` : `Bron: ${bron}, zonder datum.`)
        : (datumGeldig ? `Visie van ${fmtDate(datum)} (${dagen} dagen geleden).` : "Nog geen bron en datum ingevuld.");
      const gevolg = richting === "stijgt"
        ? "Bij een stijgende rente kan het aantrekkelijk zijn nieuw geld korter weg te zetten, zodat je eerder tegen een hoger tarief kunt herbeleggen."
        : richting === "daalt"
        ? "Bij een dalende rente kan het aantrekkelijk zijn nu juist langer vast te zetten, zolang het huidige tarief nog beschikbaar is."
        : "Bij een stabiele rente blijft gelijkmatig spreiden over de halfjaardakpan de meest robuuste keuze.";
      const waarschuwing = verouderd
        ? " Deze visie is niet meer recent — controleer of ze nog klopt voordat je haar meeweegt."
        : "";
      return {
        kop,
        verouderd,
        toelichting: `${herkomst} ${gevolg} Deze overweging is niet in het advies hierboven verwerkt; de looptijden daar volgen uitsluitend je bestaande dakpan.${waarschuwing}`
      };
    })();

    const vrijePosities = (beleggingsOverzicht.vrijeBeleggingen && beleggingsOverzicht.vrijeBeleggingen.posities) || [];
    const dividendVrijWaarde = vrijePosities
      .filter(p => /Dividend|Div Lead|High Div/i.test(p.naam || ""))
      .reduce((s,p) => s + (Number(p.waarde)||0), 0);
    const dividendVrijPct = nu.bestaandVrijBelegd > 0 ? dividendVrijWaarde / nu.bestaandVrijBelegd * 100 : 0;
    const volgendeDepositos = VERMOGENS_ITEMS
      .filter(i => i.deposito && i.vervaldatum)
      .map(i => ({datum:new Date(i.vervaldatum), bedrag:Number(i.bedrag)||0, label:i.label}))
      .filter(i => i.datum >= vandaag)
      .sort((a,b) => a.datum-b.datum);
    const eerstVolgendeDeposito = volgendeDepositos[0];

    let concreetActie = "";
    let concreetBedrag = 0;
    let concreetType = "";
    let concreetReden = "";
    const fmtPct = p => p.toFixed(2).replace(".", ",") + "%";
