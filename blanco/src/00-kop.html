<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkomensplanning</title>
<style>
:root{--tekst:#1e293b;--zacht:#64748b;--lijn:#e2e8f0;--vlak:#f8fafc;--kaart:#fff;--merk:#0f766e;--merk2:#115e59;--waarschuw:#b45309;--waarschuwvlak:#fffbeb;--fout:#b91c1c;--foutvlak:#fef2f2;--goed:#047857;--goedvlak:#ecfdf5;--info:#1d4ed8;--infovlak:#eff6ff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;color:var(--tekst);background:var(--vlak);overflow-x:hidden}
#root{min-height:100vh}
h1,h2,h3,h4{margin:0 0 .4rem;line-height:1.25}
h1{font-size:1.25rem}h2{font-size:1.1rem}h3{font-size:1rem}h4{font-size:.9rem}
p{margin:.35rem 0}
button,input,select,textarea{font:inherit;color:inherit;max-width:100%}
input,select,textarea{width:100%;padding:.5rem .6rem;border:1px solid #cbd5e1;border-radius:.5rem;background:#fff;min-height:2.5rem}
input[type=checkbox],input[type=radio]{width:1.15rem;height:1.15rem;min-height:0;padding:0;accent-color:var(--merk)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--merk);outline-offset:1px}
.kop{position:sticky;top:0;z-index:30;background:var(--merk);color:#fff;padding:.55rem 1rem;display:flex;align-items:center;gap:.6rem}
.kop .titel{flex:1;min-width:0}
.kop .titel b{display:block;font-size:1.05rem}
.kop .titel small{display:block;opacity:.85;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menuknop{background:#fff;color:var(--merk2);border:0;border-radius:.5rem;padding:.5rem .8rem;font-weight:700;cursor:pointer;white-space:nowrap}
.menulaag{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.45);display:flex;justify-content:flex-end}
.menulijst{background:#fff;width:min(20rem,88vw);height:100%;overflow-y:auto;padding:.8rem}
.menulijst button.item{display:flex;width:100%;justify-content:space-between;align-items:center;gap:.5rem;text-align:left;background:#fff;border:1px solid var(--lijn);border-radius:.6rem;padding:.7rem .8rem;margin:0 0 .4rem;font-weight:600;cursor:pointer}
.menulijst button.item.actief{background:var(--goedvlak);border-color:#6ee7b7}
.menulijst .klein{font-size:.75rem;color:var(--zacht);font-weight:400}
.pagina{max-width:46rem;margin:0 auto;padding:1rem 1rem 5rem}
.kaart{background:var(--kaart);border:1px solid var(--lijn);border-radius:.8rem;padding:.9rem;margin:0 0 .8rem}
.kaart.waarschuw{background:var(--waarschuwvlak);border-color:#fcd34d}
.kaart.fout{background:var(--foutvlak);border-color:#fca5a5}
.kaart.goed{background:var(--goedvlak);border-color:#6ee7b7}
.kaart.info{background:var(--infovlak);border-color:#93c5fd}
.klein{font-size:.8rem;color:var(--zacht)}
.rood{color:var(--fout)}.groen{color:var(--goed)}.oranje{color:var(--waarschuw)}
.knop{background:var(--merk);color:#fff;border:0;border-radius:.55rem;padding:.55rem .9rem;font-weight:600;cursor:pointer;min-height:2.5rem}
.knop:disabled{opacity:.45;cursor:default}
.knop.sec{background:#fff;color:var(--merk2);border:1px solid #99a6b3}
.knop.gevaar{background:#fff;color:var(--fout);border:1px solid #fca5a5}
.knop.klein2{padding:.3rem .6rem;min-height:2rem;font-size:.85rem}
.rij{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.rij.eind{justify-content:flex-end}
.rij.tussen{justify-content:space-between}
.raster{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.raster3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem}
@media (max-width:520px){.raster,.raster3{grid-template-columns:1fr}}
.veld{display:block;margin:0 0 .6rem;min-width:0}
.veld>span{display:block;font-size:.8rem;font-weight:600;margin-bottom:.15rem}
.veld>small{display:block;font-size:.75rem;color:var(--zacht);margin-top:.15rem}
.veld.fout input,.veld.fout select{border-color:var(--fout)}
.vink{display:flex;gap:.5rem;align-items:flex-start;margin:0 0 .5rem}
.vink span{flex:1}
.tabelwrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:.3rem .4rem;border-bottom:1px solid var(--lijn);text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{font-size:.75rem;color:var(--zacht);font-weight:700}
td.get,th.get{text-align:right;white-space:nowrap}
tr.totaal td{font-weight:700;border-top:2px solid #94a3b8}
tr.klik td{cursor:pointer}
.badge{display:inline-block;border-radius:999px;padding:.05rem .5rem;font-size:.72rem;font-weight:700;background:#e2e8f0}
.badge.goed{background:#d1fae5;color:#065f46}.badge.waarschuw{background:#fef3c7;color:#92400e}.badge.fout{background:#fee2e2;color:#991b1b}
.balk{height:.6rem;background:#e2e8f0;border-radius:999px;overflow:hidden}
.balk>i{display:block;height:100%;background:var(--merk)}
.lijst{margin:.2rem 0;padding-left:1.1rem}
.lijst li{margin:.2rem 0}
.modaal{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center}
.modaal>div{background:#fff;width:100%;max-width:40rem;max-height:92vh;overflow-y:auto;border-radius:1rem 1rem 0 0;padding:1rem}
@media (min-width:700px){.modaal{align-items:center}.modaal>div{border-radius:1rem}}
.intakekop{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.4rem}
.stappen{display:flex;gap:.25rem;margin:.3rem 0 .8rem}
.stappen i{flex:1;height:.3rem;border-radius:99px;background:#e2e8f0}
.stappen i.klaar{background:var(--merk)}
.leeg{text-align:center;padding:1.4rem .8rem}
.leeg p{color:var(--zacht)}
.tabs{display:flex;gap:.3rem;overflow-x:auto;margin:0 0 .8rem;padding-bottom:.2rem}
.tabs button{flex:0 0 auto;border:1px solid var(--lijn);background:#fff;border-radius:999px;padding:.35rem .8rem;font-weight:600;cursor:pointer}
.tabs button.actief{background:var(--merk);color:#fff;border-color:var(--merk)}
.linkknop{background:none;border:0;color:var(--merk);text-decoration:underline;cursor:pointer;padding:0;font:inherit;white-space:nowrap}
.kleurpunt{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;margin-right:.3rem;vertical-align:baseline}
.melding{position:fixed;left:.5rem;right:.5rem;bottom:.5rem;z-index:90;background:var(--foutvlak);border:1px solid #fca5a5;border-radius:.6rem;padding:.6rem .8rem;font-size:.85rem}
/* Rapport */
.rp-pagina{background:#fff;border:1px solid var(--lijn);border-radius:.6rem;padding:1rem;margin:0 0 1rem}
.rp-tabel{width:100%}
.rp-tabel tr{break-inside:avoid}
.rp-lijst{margin:.2rem 0;padding-left:1.1rem}
.rp-sectie{margin:0 0 1rem}
.rp-sectie h2{border-bottom:2px solid var(--merk);padding-bottom:.2rem}
@media print{
  body{background:#fff;font-size:10.5pt;overflow:visible}
  .noprint,.kop,.menulaag,.melding{display:none!important}
  .pagina{max-width:none;padding:0}
  .rp-pagina{border:0;border-radius:0;padding:0;margin:0}
  .rp-nieuwepagina{break-before:page}
  .rp-sectie{break-inside:auto}
  .rp-sectie h2,.rp-sectie h3{break-after:avoid}
  table{font-size:9pt}
  .tabelwrap{overflow:visible}
  .kaart{break-inside:avoid;border-color:#cbd5e1}
  svg{max-width:100%}
}
</style>
</head>
<body>
<div id="root"></div>
